[package]
name = "amicu-api"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
amicu-auth = { path = "../amicu-auth" }
amicu-core = { path = "../amicu-core", features = ["utoipa"] }
amicu-engine = { path = "../amicu-engine" }
amicu-hcl = { path = "../amicu-hcl" }
amicu-plan = { path = "../amicu-plan", features = ["utoipa"] }
async-trait = "0.1"
axum = "0.8"
ipnet = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
utoipa = { version = "5" }
utoipa-axum = { version = "0.2" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# HTTP tests implement the Notifier trait to capture the out-of-band reset token.
async-trait = "0.1"

[lints]
workspace = true
