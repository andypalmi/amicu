[package]
name = "amicu-llamacpp"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
amicu-core = { path = "../amicu-core" }
amicu-runtime = { path = "../amicu-runtime" }
amicu-registry = { path = "../amicu-registry" }
async-trait = "0.1"
thiserror = "2"
serde_json = "1"
# HTTP client for the health probe; http-only (localhost), no TLS pulled in.
ureq = { version = "3", default-features = false }
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
