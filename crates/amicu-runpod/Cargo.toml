[package]
name = "amicu-runpod"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "RunPod v2 REST client for amicu: serverless endpoints, secrets, hardware and region mapping."

[dependencies]
amicu-core = { path = "../amicu-core" }
# The `HttpTransport` seam, the shared residency / data-center table, and the
# error-mapping conventions the other REST providers use.
amicu-providers = { path = "../amicu-providers" }
# `supervisor.rs`: `RunPodSupervisor` implements `amicu_llamacpp::ProcessSupervisor`
# (an `#[async_trait]`) and renders the launch with the shared remote-container
# rewrite in `amicu_llamacpp::remote`. Neither crate depends back on this one.
amicu-llamacpp = { path = "../amicu-llamacpp" }
amicu-runtime = { path = "../amicu-runtime" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# The readiness wait's backoff sleeps and deadline.
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
