[package]
name = "amicu-auth"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["verifier", "issuer"]
# Offline token verification seam other services embed. Deliberately light: no
# signing/password/key-generation deps.
verifier = []
# Token issuance, key generation/rotation, password hashing, session stores.
issuer = [
    "dep:ed25519-dalek",
    "dep:argon2",
    "dep:rand_core",
    "dep:sha2",
    "dep:zeroize",
    "dep:tokio",
]
# reqwest-backed JWKS fetcher for the verifier. Off by default so embedders pick
# their own transport; the cache/refetch logic is transport-agnostic.
reqwest-provider = ["verifier", "dep:reqwest"]

[dependencies]
amicu-core = { path = "../amicu-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
# EdDSA sign/verify. v10+ requires an explicit crypto backend: `rust_crypto`
# (pure Rust, hermetic, holds MSRV 1.97). PEM is parsed by ed25519-dalek here, so
# the default `use_pem` feature is dropped.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }

# issuer-only
ed25519-dalek = { version = "2", default-features = false, features = ["std", "pkcs8", "pem", "rand_core", "zeroize"], optional = true }
argon2 = { version = "0.5", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
sha2 = { version = "0.10", optional = true }
zeroize = { version = "1", features = ["derive"], optional = true }
# Detached background delivery: `/recover` and the duplicate-signup notice
# dispatch the (possibly network-bound) out-of-band send off the response path
# via `tokio::spawn`, so response timing never depends on account existence.
tokio = { version = "1", default-features = false, features = ["rt"], optional = true }

# verifier http transport
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"], optional = true }

[dev-dependencies]
# rt-multi-thread: the refresh-rotation race test needs true parallelism to
# exercise the atomic compare-and-revoke under contention.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
serde_json = "1"
# Integration tests implement the Notifier trait (a capturing test double).
async-trait = "0.1"

[lints]
workspace = true
