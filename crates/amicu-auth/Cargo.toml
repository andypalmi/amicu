[package]
name = "amicu-auth"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["verifier", "issuer"]
# Offline token verification seam other services embed. Deliberately light: no
# signing/password/key-generation deps.
verifier = []
# Token issuance, key generation/rotation, password hashing, session stores.
issuer = [
    "dep:ed25519-dalek",
    "dep:pkcs8",
    "dep:argon2",
    "dep:rand_core",
    "dep:sha2",
    "dep:zeroize",
    "dep:tokio",
]
# reqwest-backed JWKS fetcher for the verifier. Off by default so embedders pick
# their own transport; the cache/refetch logic is transport-agnostic.
reqwest-provider = ["verifier", "dep:reqwest"]

[dependencies]
amicu-core = { path = "../amicu-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
# EdDSA sign/verify. v10+ requires an explicit crypto backend: `rust_crypto`
# (pure Rust, hermetic, holds MSRV 1.97). PEM is parsed by ed25519-dalek here, so
# the default `use_pem` feature is dropped.
#
# `rust_crypto` unconditionally bundles the `rsa` crate (RUSTSEC-2023-0071,
# no upstream fix) alongside ed25519-dalek/hmac/p256/p384 - there is no
# finer-grained feature to opt RSA back out of on this backend, and this
# crate only ever signs/verifies Algorithm::EdDSA. See SECURITY-NOTES.md.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }

# issuer-only
ed25519-dalek = { version = "2", default-features = false, features = ["std", "pkcs8", "pem", "rand_core", "zeroize"], optional = true }
# `ed25519_dalek::pkcs8` only re-exports a handful of the `pkcs8` crate's
# items (not `LineEnding`); `generate_pkcs8_pem` (key.rs) needs `LineEnding`
# directly to encode a freshly generated key back to PEM for
# `amicu-server gen-signing-key`. Pinned to the same version ed25519-dalek 2.x
# already pulls in (feature-unified, not a second copy).
pkcs8 = { version = "0.10", default-features = false, features = ["pem"], optional = true }
argon2 = { version = "0.5", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
sha2 = { version = "0.10", optional = true }
zeroize = { version = "1", features = ["derive"], optional = true }
# Anti-enumeration response-timing floor. `/recover` and `/verify/resend` do
# their account-dependent work INLINE now (Cloud Run freezes detached tasks once
# the response is written - amicu-planning#141) and pad to a fixed deadline with
# `tokio::time::sleep_until`, so response timing never depends on account
# existence. `time` only: no runtime, no `spawn`.
tokio = { version = "1", default-features = false, features = ["time"], optional = true }
# Global user ids and workspace ids are UUIDs (the token `sub`/`wsid`, the
# users.id PK, and every auth token table foreign key). Non-optional: the always
# -compiled `tenant::WorkspaceId` carried in every `Claims` needs it on both the
# verifier and issuer paths. `serde` backs the `#[serde(transparent)]` wire form;
# `v4` mints fresh ids at sign-up/provisioning.
uuid = { version = "1", default-features = false, features = ["v4", "serde", "std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

# verifier http transport
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"], optional = true }

[dev-dependencies]
# rt-multi-thread: the refresh-rotation race test needs true parallelism to
# exercise the atomic compare-and-revoke under contention.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
serde_json = "1"
# Integration tests implement the Notifier trait (a capturing test double).
async-trait = "0.1"

[lints]
workspace = true
