[package]
name = "amicu-core"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Additive OpenAPI schema derivation for the diagnostic contract, enabled by the
# HTTP API so `DiagnosticReport` and friends can be served as OpenAPI
# components. Off by default: nothing in the core/CLI path depends on it.
utoipa = ["dep:utoipa"]

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
utoipa = { version = "5", optional = true }

[dev-dependencies]
rustversion = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt"] }
trybuild = "1"

[lints]
workspace = true
