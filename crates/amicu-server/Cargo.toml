[package]
name = "amicu-server"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.dist]
dist = false

[[bin]]
name = "amicu-server"
path = "src/main.rs"

[lib]
name = "amicu_server"
path = "src/lib.rs"

[dependencies]
amicu-api = { path = "../amicu-api" }
amicu-auth = { path = "../amicu-auth" }
# SecretValue, to read AMICU_EDGE_TOKEN without ever letting it flow through a
# clap flag (see the crate docs' "Cloudflare edge trust" section).
# Previously a dev-only dependency (the SMTP
# render tests already used it); promoted to a real dependency here. Also
# wraps the raw signing-key PEM read from AMICU_SIGNING_KEY_PEM /
# AMICU_SIGNING_KEYS_RETIRING_PEM in a redacted, zeroizing SecretValue the
# instant it would otherwise touch a bare String-typed Config field (see
# src/signing_key.rs).
amicu-core = { path = "../amicu-core" }
amicu-state = { path = "../amicu-state" }
amicu-store = { path = "../amicu-store" }
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
# Real SMTP sender for verification/reset emails. rustls (never native-tls) with
# the ring crypto backend and bundled webpki roots keeps the TLS stack hermetic
# and MSRV-friendly, matching the workspace convention (see amicu-providers /
# amicu-api). Default features are off so no native-tls or OpenSSL is pulled in.
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls",
    "rustls",
    "ring",
    "webpki-roots",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }
# Zeroize-on-drop intermediates while normalizing/splitting the raw
# signing-key PEM (src/signing_key.rs), so no un-zeroized copy of key
# material survives a `.replace()`/`format!()` step longer than it has to.
# Already pulled in transitively via amicu-core/amicu-auth; pinned here as a
# direct dependency at the same version already resolved in Cargo.lock (no
# version bump).
zeroize = "1"

[dev-dependencies]
# Real-socket smoke test: a genuine HTTP client over a live TCP connection is
# the only thing that catches a missing `into_make_service_with_connect_info`
# (see the crate/test docs). No TLS: the test talks plain HTTP to 127.0.0.1.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json = "1"
# Unique per-test rate-limit keys in the live Postgres limiter tests (same
# version already used workspace-wide, e.g. amicu-store's Cargo.toml).
uuid = { version = "1", features = ["v4"] }
# Decodes the JWT header (to read `kid`) in the signing-key replica
# integration tests. Matches the version pin amicu-auth/amicu-core already
# use.
base64 = "0.22"

[lints]
workspace = true
