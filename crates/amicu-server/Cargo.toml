[package]
name = "amicu-server"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "amicu-server"
path = "src/main.rs"

[lib]
name = "amicu_server"
path = "src/lib.rs"

[dependencies]
amicu-api = { path = "../amicu-api" }
amicu-auth = { path = "../amicu-auth" }
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[dev-dependencies]
# Real-socket smoke test: a genuine HTTP client over a live TCP connection is
# the only thing that catches a missing `into_make_service_with_connect_info`
# (see the crate/test docs). No TLS: the test talks plain HTTP to 127.0.0.1.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json = "1"

[lints]
workspace = true
