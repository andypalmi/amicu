[package]
name = "amicu-state"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
amicu-core = { path = "../amicu-core" }
# `RuntimeHandle` is the endpoint/handle shape stored in deployment records.
amicu-runtime = { path = "../amicu-runtime" }
async-trait = "0.1"
thiserror = "2"
# Lock tokens must be minted from a true-randomness source (see `LockHandle`'s
# security note), matching `amicu-store::PostgresStateBackend`'s use of
# `OsRng` - the same version amicu-store already depends on.
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# `LeaseKeeper` renews the lock lease from a background task.
tokio = { version = "1", features = ["rt", "time", "sync"] }

[dev-dependencies]
rustversion = "1"
tokio = { version = "1", features = ["macros", "rt", "time"] }
trybuild = "1"

[lints]
workspace = true
