[package]
name = "amicu-runtime"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
amicu-core = { path = "../amicu-core" }
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The shared post-deploy exposure check (`exposure`) probes endpoints over
# HTTP; same reqwest build as `amicu-modal` (no default features, rustls).
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time"] }

[lints]
workspace = true
