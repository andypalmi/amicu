[package]
name = "amicu-providers"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
amicu-core = { path = "../amicu-core" }
async-trait = "0.1"
# rustls (not native-tls) to keep the build free of a system OpenSSL dependency.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
# Pure-Rust async SSH client for the self-hosted transport seam. The `ring`
# backend (not the default aws-lc-rs) keeps the build hermetic like rustls: no
# system OpenSSL/libssh2 C dependency, and it holds MSRV 1.97.
russh = { version = "0.63", default-features = false, features = ["ring", "flate2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Credential binding fingerprint (truncated, domain-separated SHA-256).
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
# Random identity nonce (UUIDv4 entropy).
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util"] }

[lints]
workspace = true
