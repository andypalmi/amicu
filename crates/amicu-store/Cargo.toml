[package]
name = "amicu-store"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Postgres-only persistence. Parameterized queries only; the compile-time
# `query!`/`query_as!` macros are deliberately NOT pulled in yet (they need a
# live DB or an offline cache). This scaffold uses only pool construction and
# `migrate!()`, which embeds the .sql files at compile time and needs no DB.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "uuid",
] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
serde_json = "1"

[lints]
workspace = true
