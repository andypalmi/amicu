[package]
name = "amicu-store"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Postgres-only persistence. Parameterized queries only, via the compile-time
# `query!`/`query_as!` macros: they verify SQL against the schema at build time
# (using a live DB or the committed `.sqlx/` offline cache) and forbid
# string-built SQL by construction. Pool construction and `migrate!()` (which
# embeds the .sql files at compile time) need no DB.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "uuid",
] }
# The auth store traits (UserStore/RefreshStore/ResetStore) and their record
# types live behind amicu-auth's `issuer` feature (on by default); the Postgres
# stores here implement them.
amicu-auth = { path = "../amicu-auth" }
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# Server-side content hashing for the config store (content_sha256).
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
serde_json = "1"

[lints]
workspace = true
