[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.1"
license = "AGPL-3.0-only"
repository = "https://github.com/andypalmi/amicu"
rust-version = "1.97"
description = "Terraform for AI inference infrastructure: declarative HCL config, planner and apply engine"
homepage = "https://amicu.dev"
readme = "README.md"
keywords = ["llm", "inference", "cli", "infrastructure", "gpu"]
categories = ["command-line-utilities"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
