# release-plz: version bump, changelog and tag. cargo-dist (release.yml) builds
# the artifacts and creates the GitHub Release when the tag is pushed.
[workspace]
# One shared version (workspace.package.version), one tag, one changelog.
changelog_path = "./CHANGELOG.md"
changelog_update = true
git_release_enable = false      # cargo-dist creates the GitHub Release
git_tag_enable = false          # only the CLI package tags (below)
publish = false                 # no crates.io in v1
semver_check = false            # no published baseline yet
release_commits = "^(feat|fix|perf|refactor)"

# The CLI package carries the tag and changelog for the whole workspace.
[[package]]
name = "amicu-cli"
git_tag_enable = true
git_tag_name = "v{{ version }}"
changelog_update = true
changelog_include = [
  "amicu-core", "amicu-hcl", "amicu-plan", "amicu-engine", "amicu-llamacpp",
  "amicu-vllm", "amicu-runtime", "amicu-modal", "amicu-providers",
  "amicu-registry", "amicu-state",
]
