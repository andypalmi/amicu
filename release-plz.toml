# release-plz: version bump, changelog and tag. cargo-dist (release.yml) builds
# the artifacts and creates the GitHub Release when the tag is pushed.
[workspace]
# One shared version (workspace.package.version), one tag, one changelog.
changelog_path = "./CHANGELOG.md"
changelog_update = false        # only amicu-cli writes the changelog (below)
git_release_enable = false      # cargo-dist creates the GitHub Release
git_tag_enable = false          # only the CLI package tags (below)
# Every package shares the CLI's tag name. With git_only, release-plz finds a
# package's previous release by matching its git_tag_name against existing
# tags; without this, the untagged crates look unreleased on every run, so
# each release PR re-bumps them and re-lists their whole history.
git_tag_name = "v{{ version }}"
git_only = true                 # versions come from git tags (not on crates.io); skips cargo publish
release_always = false          # tag only when a release PR is merged
semver_check = false            # no published baseline yet
release_commits = "^(feat|fix|perf|refactor)"

# The CLI package carries the tag and changelog for the whole workspace.
[[package]]
name = "amicu-cli"
git_tag_enable = true
changelog_path = "./CHANGELOG.md"
changelog_update = true
changelog_include = [
  "amicu-core", "amicu-hcl", "amicu-plan", "amicu-engine", "amicu-llamacpp",
  "amicu-vllm", "amicu-runtime", "amicu-modal", "amicu-providers",
  "amicu-registry", "amicu-state", "amicu-runpod", "amicu-gcp",
]

# No tag matches, so it is an initial release. Remove after the first release containing it.
[[package]]
name = "amicu-runpod"
git_tag_name = "amicu-runpod-v{{ version }}"

[[package]]
name = "amicu-gcp"
git_tag_name = "amicu-gcp-v{{ version }}"
