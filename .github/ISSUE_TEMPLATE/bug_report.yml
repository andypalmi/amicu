name: Bug report
description: Something in amicu (CLI, server or web) does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do not go here. Report them privately, see https://github.com/andypalmi/amicu/security/policy.
  - type: input
    id: version
    attributes:
      label: amicu version or commit
      placeholder: "amicu --version, or the commit SHA"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - Server / API
        - Web
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Rust or Node version, and the provider involved if any.
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Remove secrets, API keys and endpoint credentials before pasting.
      render: shell
