name: Bug report
description: Something in amicu (CLI, server or web) does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Keep it short: one problem per issue, about 150 words plus the repro. No summaries or speculative fixes.
        Security problems do not go here. Report them privately, see https://github.com/andypalmi/amicu/security/policy.
  - type: input
    id: version
    attributes:
      label: amicu version
      placeholder: "output of amicu --version"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "e.g. macOS 15 arm64, Ubuntu 24.04 x86_64"
    validations:
      required: true
  - type: input
    id: accelerator
    attributes:
      label: Accelerator
      placeholder: "e.g. Apple M2 Metal, NVIDIA RTX 4090 CUDA 12, CPU only"
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command run
      placeholder: "the exact command"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Full output
      description: Complete output, not an excerpt. Remove secrets and API keys first.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual
      description: One line each.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I reproduced this on the latest release and searched existing issues.
          required: true
