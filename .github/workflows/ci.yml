name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Shrink target/ on the (disk-limited) runners: no debuginfo, no incremental.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt / clippy / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free disk space
        run: |
          # Drop large preinstalled toolchains we never use so the
          # workspace build (target/) fits on the runner disk.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked

  commit-messages:
    name: no Claude attribution in commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # base..head needs both tips and their history
      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            if ! .githooks/no-claude-attribution.sh check "$RUNNER_TEMP/msg"; then
              echo "::error::commit $sha contains Claude attribution (lines above)"
              bad=1
            fi
          done
          exit $bad

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history so the base branch diff below works

      # Policy: advisories appear independently of code changes, so the audit
      # only BLOCKS a PR that itself touches Rust dependencies. Otherwise it
      # still runs and reports, but a failure is non-blocking (also on push to
      # main, so advisories alone never redden main or stop deploys). The
      # daily audit.yml workflow opens an issue for failures on main.
      - name: Detect dependency changes
        id: deps
        run: |
          set -euo pipefail
          blocking=false
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Fail closed: a git error aborts the step (set -e), failing the job.
            git rev-parse --verify "origin/$GITHUB_BASE_REF" > /dev/null
            changed=$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")
            if grep -Eq '(^|/)(Cargo\.lock|Cargo\.toml)$|^\.cargo/audit\.toml$' <<< "$changed"; then
              blocking=true
            fi
          fi
          echo "blocking=$blocking" >> "$GITHUB_OUTPUT"
          echo "Audit blocking: $blocking"

      # `.cargo/audit.toml` carries the ignore list for advisories with no
      # available fix (each entry documents why + its removal condition);
      # `cargo audit` picks that file up automatically from the repo root.
      - uses: taiki-e/install-action@977cdbe2e748fc9d5798e3098868c4c4463bf31b # cargo-audit
        with:
          tool: cargo-audit

      - name: Audit
        continue-on-error: ${{ steps.deps.outputs.blocking != 'true' }}
        run: cargo audit

  docker:
    name: docker (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Verifies the multi-stage Dockerfile actually builds (cargo-chef
      # plan/cook, SQLX_OFFLINE against the committed .sqlx/ cache, the
      # --locked release build of amicu-server, distroless runtime) on every
      # push/PR - this is the only build verification the image gets today
      # (amicu-planning#143): Docker is unavailable on the maintainer's
      # local machine, and `push: false` means no registry credentials are
      # needed here at all. The real push+deploy happens in
      # deploy-api.yml, gated on `main` only, with WIF auth.
      - name: Build image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          build-args: |
            GIT_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  msrv:
    name: msrv (1.97)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free disk space
        run: |
          # Drop large preinstalled toolchains we never use so the
          # workspace build (target/) fits on the runner disk.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97
        with:
          toolchain: "1.97"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build (MSRV)
        run: cargo build --workspace --all-targets --locked

      - name: Compile-fail guard (trybuild, pinned)
        run: cargo test -p amicu-core -p amicu-state --test compile_fail -- --include-ignored

  web:
    name: web (generated-client drift / lint / typecheck / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history for the base branch diff below

      # `uses:` steps ignore `defaults.run.working-directory`, so point
      # action-setup at the web package.json for its pinned `packageManager`
      # (the repo root is a Rust workspace with no package.json).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Same policy as the cargo audit job: blocking only when the PR
      # touches the web lockfile or a package.json; otherwise non-blocking.
      - name: Detect dependency changes
        id: deps
        working-directory: .
        run: |
          set -euo pipefail
          blocking=false
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Fail closed: a git error aborts the step (set -e), failing the job.
            git rev-parse --verify "origin/$GITHUB_BASE_REF" > /dev/null
            changed=$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")
            if grep -Eq '^web/(.*/)?(package\.json|pnpm-lock\.yaml)$|^web/pnpm-workspace\.yaml$' <<< "$changed"; then
              blocking=true
            fi
          fi
          echo "blocking=$blocking" >> "$GITHUB_OUTPUT"
          echo "Audit blocking: $blocking"

      # Fails on any high/critical advisory in the web lockfile (when blocking).
      - name: Audit
        continue-on-error: ${{ steps.deps.outputs.blocking != 'true' }}
        run: pnpm audit --audit-level=high

      # Fails if the committed @amicu/api-client no longer matches
      # crates/amicu-schema/openapi.json (i.e. the spec changed but nobody
      # reran `pnpm --filter @amicu/api-client generate`).
      - name: Generated-client drift check
        run: pnpm check:generated

      # Colours come only from tokens.css (also part of `pnpm lint`; run first for a fast, explicit failure).
      - name: Token-only colours
        run: pnpm check:colors

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Internal link check
        run: pnpm lint:links

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  dist-check:
    name: dist generate is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: taiki-e/install-action@977cdbe2e748fc9d5798e3098868c4c4463bf31b # cargo-audit
        with:
          tool: cargo-dist@0.33.0

      - name: Verify release.yml matches dist-workspace.toml
        run: dist generate --check

      - name: Plan the release
        run: dist plan
