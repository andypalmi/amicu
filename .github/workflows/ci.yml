name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `.cargo/audit.toml` carries the ignore list for advisories with no
      # available fix (each entry documents why + its removal condition);
      # `cargo audit` picks that file up automatically from the repo root.
      - uses: taiki-e/install-action@cargo-audit

      - name: Audit
        run: cargo audit

  msrv:
    name: msrv (1.97)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97

      - uses: Swatinem/rust-cache@v2

      - name: Build (MSRV)
        run: cargo build --workspace --all-targets --locked

      - name: Compile-fail guard (trybuild, pinned)
        run: cargo test -p amicu-core -p amicu-state --test compile_fail -- --include-ignored

  web:
    name: web (generated-client drift / lint / typecheck / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # `uses:` steps ignore `defaults.run.working-directory`, so point
      # action-setup at the web package.json for its pinned `packageManager`
      # (the repo root is a Rust workspace with no package.json).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fails on any high/critical advisory in web/pnpm-lock.yaml. Known to
      # be currently red on main (Next.js/sharp/js-yaml advisories) pending
      # the in-flight PR that owns the web lockfile.
      - name: Audit
        run: pnpm audit --audit-level=high

      # Fails if the committed @amicu/api-client no longer matches
      # crates/amicu-schema/openapi.json (i.e. the spec changed but nobody
      # reran `pnpm --filter @amicu/api-client generate`).
      - name: Generated-client drift check
        run: pnpm check:generated

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
