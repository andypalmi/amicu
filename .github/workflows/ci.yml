name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Shrink target/ on the (disk-limited) runners: no debuginfo, no incremental.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt / clippy / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # Drop large preinstalled toolchains we never use so the
          # workspace build (target/) fits on the runner disk.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the base branch diff below works

      # Policy: advisories appear independently of code changes, so the audit
      # only BLOCKS a PR that itself touches Rust dependencies. Otherwise it
      # still runs and reports, but a failure is non-blocking (also on push to
      # main, so advisories alone never redden main or stop deploys). The
      # daily audit.yml workflow opens an issue for failures on main.
      - name: Detect dependency changes
        id: deps
        run: |
          set -euo pipefail
          blocking=false
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Fail closed: a git error aborts the step (set -e), failing the job.
            git rev-parse --verify "origin/$GITHUB_BASE_REF" > /dev/null
            changed=$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")
            if grep -Eq '(^|/)(Cargo\.lock|Cargo\.toml)$|^\.cargo/audit\.toml$' <<< "$changed"; then
              blocking=true
            fi
          fi
          echo "blocking=$blocking" >> "$GITHUB_OUTPUT"
          echo "Audit blocking: $blocking"

      # `.cargo/audit.toml` carries the ignore list for advisories with no
      # available fix (each entry documents why + its removal condition);
      # `cargo audit` picks that file up automatically from the repo root.
      - uses: taiki-e/install-action@cargo-audit

      - name: Audit
        continue-on-error: ${{ steps.deps.outputs.blocking != 'true' }}
        run: cargo audit

  docker:
    name: docker (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Verifies the multi-stage Dockerfile actually builds (cargo-chef
      # plan/cook, SQLX_OFFLINE against the committed .sqlx/ cache, the
      # --locked release build of amicu-server, distroless runtime) on every
      # push/PR - this is the only build verification the image gets today
      # (amicu-planning#143): Docker is unavailable on the maintainer's
      # local machine, and `push: false` means no registry credentials are
      # needed here at all. The real push+deploy happens in
      # deploy-api.yml, gated on `main` only, with WIF auth.
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            GIT_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  msrv:
    name: msrv (1.97)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # Drop large preinstalled toolchains we never use so the
          # workspace build (target/) fits on the runner disk.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - uses: dtolnay/rust-toolchain@1.97

      - uses: Swatinem/rust-cache@v2

      - name: Build (MSRV)
        run: cargo build --workspace --all-targets --locked

      - name: Compile-fail guard (trybuild, pinned)
        run: cargo test -p amicu-core -p amicu-state --test compile_fail -- --include-ignored

  web:
    name: web (generated-client drift / lint / typecheck / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the base branch diff below

      # `uses:` steps ignore `defaults.run.working-directory`, so point
      # action-setup at the web package.json for its pinned `packageManager`
      # (the repo root is a Rust workspace with no package.json).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Same policy as the cargo audit job: blocking only when the PR
      # touches the web lockfile or a package.json; otherwise non-blocking.
      - name: Detect dependency changes
        id: deps
        working-directory: .
        run: |
          set -euo pipefail
          blocking=false
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Fail closed: a git error aborts the step (set -e), failing the job.
            git rev-parse --verify "origin/$GITHUB_BASE_REF" > /dev/null
            changed=$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")
            if grep -Eq '^web/(.*/)?(package\.json|pnpm-lock\.yaml)$|^web/pnpm-workspace\.yaml$' <<< "$changed"; then
              blocking=true
            fi
          fi
          echo "blocking=$blocking" >> "$GITHUB_OUTPUT"
          echo "Audit blocking: $blocking"

      # Fails on any high/critical advisory in the web lockfile (when blocking).
      - name: Audit
        continue-on-error: ${{ steps.deps.outputs.blocking != 'true' }}
        run: pnpm audit --audit-level=high

      # Fails if the committed @amicu/api-client no longer matches
      # crates/amicu-schema/openapi.json (i.e. the spec changed but nobody
      # reran `pnpm --filter @amicu/api-client generate`).
      - name: Generated-client drift check
        run: pnpm check:generated

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Internal link check
        run: pnpm lint:links

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
