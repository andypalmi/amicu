name: Dependency audit

# Daily audit of main. Advisories appear independently of code changes, so
# ci.yml only blocks PRs that touch dependencies; this workflow is what
# surfaces new advisories, by opening (or commenting on) a tracking issue.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: audit (main)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: taiki-e/install-action@977cdbe2e748fc9d5798e3098868c4c4463bf31b # cargo-audit
        with:
          tool: cargo-audit

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: cargo audit
        id: cargo
        continue-on-error: true
        run: cargo audit

      - name: pnpm audit
        id: pnpm
        continue-on-error: true
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high

      - name: Report failure as an issue
        if: github.ref == 'refs/heads/main' && (steps.cargo.outcome == 'failure' || steps.pnpm.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Dependency audit failing on main
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="Dependency audit failed on $GITHUB_REF_NAME (cargo audit: ${{ steps.cargo.outcome }}, pnpm audit: ${{ steps.pnpm.outcome }}). See $run_url"
          existing=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" \
            --json number,title --jq "[.[] | select(.title == \"$ISSUE_TITLE\")][0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body"
          fi

      - name: Close tracking issue when green
        if: github.ref == 'refs/heads/main' && steps.cargo.outcome == 'success' && steps.pnpm.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Dependency audit failing on main
        run: |
          existing=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" \
            --json number,title --jq "[.[] | select(.title == \"$ISSUE_TITLE\")][0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "audit green again"
            gh issue close "$existing"
          fi

      - name: Fail run if audit failed
        if: steps.cargo.outcome == 'failure' || steps.pnpm.outcome == 'failure'
        run: exit 1
