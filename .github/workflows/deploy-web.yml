name: Deploy Web (Cloudflare Workers)

# Cloudflare Workers deploy job shape
# (pnpm install --frozen-lockfile -> build -> cloudflare/wrangler-action),
# adapted for amicu's OpenNext Worker (a real server Worker with a `main`
# script, not a pure-static-assets SPA - see
# web/apps/web/wrangler.jsonc and README-deploy-cloudflare.md).
#
# Gated behind the same
# `production` GitHub environment as deploy-api.yml (restricted to `main`),
# so production deploys need that environment's approval.
on:
  # Manual only: GitHub's free plan has no required reviewers on environments
  # for private repos, so the `production` environment can't gate deploys.
  # Dispatching the workflow (from main) IS the gate.
  workflow_dispatch:
    inputs:
      skip_ci_check:
        description: "Skip the CI-success check (only when Actions minutes are exhausted and CI was run locally)"
        type: boolean
        default: false

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Build & deploy OpenNext Worker
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: web
    steps:
      - name: Verify CI passed for this commit
        # Runs before checkout, so web/ doesn't exist yet.
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SKIP: ${{ inputs.skip_ci_check }}
        run: |
          if [ "$SKIP" = "true" ]; then
            echo "::warning title=CI check SKIPPED::skip_ci_check=true - deploying $GITHUB_SHA WITHOUT verifying CI. Only valid if CI was run locally."
            exit 0
          fi
          c=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --branch main -L 1 --json conclusion -q '.[0].conclusion')
          [ "$c" = "success" ] || { echo "::error::CI for $GITHUB_SHA is '${c:-none/in_progress}'"; exit 1; }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Activates the `packageManager` pin in web/package.json
      # ("pnpm@11.22.0") via Node 22's built-in corepack, same pin CI's
      # `web` job gets from pnpm/action-setup's package_json_file input -
      # corepack is the more direct way to honor that pin from a plain
      # actions/setup-node step.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `cf:deploy` (web/apps/web/package.json) is
      # `opennextjs-cloudflare build && opennextjs-cloudflare deploy --
      # --keep-vars` - `--keep-vars` preserves whatever non-secret `vars`
      # and `wrangler secret put` values already set on the Worker
      # (Cloudflare dashboard / CLI) that are not in wrangler.jsonc (which
      # now commits the production vars). Runtime
      # secrets (a BFF session secret, etc.) are never set here - see
      # docs/deploy/cloud-run.md and web/apps/web/README-deploy-cloudflare.md.
      - name: Build & deploy
        run: pnpm --filter @amicu/web cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Public/build-time only (baked into the client bundle either
          # way, per web/apps/web/README-deploy-cloudflare.md) - a repo
          # variable, not a secret.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://app.amicu.dev' }}
          # Build-time, default OFF (unset/empty => sign-in hidden). Set the repo variable to "true" to expose it.
          NEXT_PUBLIC_SIGNIN_ENABLED: ${{ vars.NEXT_PUBLIC_SIGNIN_ENABLED }}
