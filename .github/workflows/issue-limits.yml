name: Issue limits

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  limits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const issue = context.payload.issue;
            const { owner, repo } = context.repo;
            const trusted = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            if (trusted.includes(issue.author_association)) return;

            const MAX_OPEN = 3;
            const MAX_BODY = 3000;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', creator: issue.user.login, per_page: 100,
            });
            const others = open.filter(i => !i.pull_request && i.number !== issue.number);

            if (others.length >= MAX_OPEN) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `You have ${others.length} open issues; please wait for those to be triaged before filing more.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number,
                state: 'closed', state_reason: 'not_planned',
              });
              return;
            }

            // Issue-form bodies render each field as "### <label>" then the value.
            // Label -> max characters. Logs/output/command fields are exempt (not listed).
            const FIELD_LIMITS = new Map([
              ['Description', 1000],
              ['Problem', 1000],
              ['Proposed behaviour', 1000],
              ['Expected', 500],
              ['Actual', 500],
              ['Alternatives', 500],
            ]);
            // Exempt from every length check, including the whole-body total.
            const EXEMPT = new Set(['Command run', 'Full output']);
            // Every label from .github/ISSUE_TEMPLATE/*.yml; only these start a section.
            const KNOWN = new Set([
              ...FIELD_LIMITS.keys(), ...EXEMPT,
              'amicu version', 'Area', 'OS', 'Accelerator', 'Checks',
            ]);

            const body = (issue.body || '').replace(/\r\n/g, '\n');
            const reasons = [];

            // Split into sections; ignore heading-like lines inside ``` fences.
            const sections = [{ label: null, lines: [] }];
            let fenced = false;
            for (const line of body.split('\n')) {
              if (/^\s*```/.test(line)) fenced = !fenced;
              const m = fenced ? null : /^### (.+?)\s*$/.exec(line);
              if (m && KNOWN.has(m[1])) {
                sections.push({ label: m[1], lines: [] });
              } else {
                sections[sections.length - 1].lines.push(line);
              }
            }

            let counted = 0;
            for (const { label, lines } of sections) {
              const value = lines.join('\n').trim();
              if (EXEMPT.has(label)) continue;
              if (value !== '_No response_') counted += value.length;
              const limit = FIELD_LIMITS.get(label);
              if (limit === undefined || value === '_No response_') continue;
              if (value.length > limit) {
                reasons.push(`"${label}" is ${value.length} characters (limit ${limit})`);
              }
            }

            if (counted > MAX_BODY) {
              reasons.unshift(`the issue is ${counted} characters excluding logs and command output (limit ${MAX_BODY})`);
            }

            if (reasons.length === 0) return;

            const labels = issue.labels.map(l => (typeof l === 'string' ? l : l.name));
            if (labels.includes('needs-trim')) return;

            await github.rest.issues.addLabels({
              owner, repo, issue_number: issue.number, labels: ['needs-trim'],
            });
            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: `Please shorten this issue: ${reasons.join('; ')}. Logs and command output are exempt. Edit the issue to trim it; it stays open.`,
            });
