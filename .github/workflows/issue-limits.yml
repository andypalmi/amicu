name: Issue limits

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  limits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const issue = context.payload.issue;
            const { owner, repo } = context.repo;
            const trusted = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            if (trusted.includes(issue.author_association)) return;

            const MAX_OPEN = 3;
            const MAX_BODY = 3000;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', creator: issue.user.login, per_page: 100,
            });
            const others = open.filter(i => !i.pull_request && i.number !== issue.number);

            if (others.length >= MAX_OPEN) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `You have ${others.length} open issues; please wait for those to be triaged before filing more.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number,
                state: 'closed', state_reason: 'not_planned',
              });
              return;
            }

            // Issue-form bodies render each field as "### <label>" then the value.
            // Label -> max characters. Logs/output/command fields are exempt (not listed).
            const FIELD_LIMITS = new Map([
              ['Description', 1000],
              ['Problem', 1000],
              ['Proposed behaviour', 1000],
              ['Expected', 500],
              ['Actual', 500],
              ['Alternatives', 500],
            ]);
            // Exempt from every length check, including the whole-body total.
            const EXEMPT = new Set(['Command run', 'Full output']);
            // Every label from .github/ISSUE_TEMPLATE/*.yml; only these start a section.
            const KNOWN = new Set([
              ...FIELD_LIMITS.keys(), ...EXEMPT,
              'amicu version', 'Area', 'OS', 'Accelerator', 'Checks',
            ]);
            // Required headings per form (labels from .github/ISSUE_TEMPLATE/*.yml).
            const FORMS = [
              ['Bug report', ['Area', 'amicu version', 'Expected', 'Actual']],
              ['Feature request', ['Problem', 'Proposed behaviour']],
            ];

            const body =(issue.body || '').replace(/\r\n/g, '\n');
            const reasons = [];

            // Split into sections; ignore heading-like lines inside ``` fences.
            const sections = [{ label: null, lines: [] }];
            let fenced = false;
            for (const line of body.split('\n')) {
              if (/^\s*```/.test(line)) fenced = !fenced;
              const m = fenced ? null : /^### (.+?)\s*$/.exec(line);
              if (m && KNOWN.has(m[1])) {
                sections.push({ label: m[1], lines: [] });
              } else {
                sections[sections.length - 1].lines.push(line);
              }
            }

            const present = new Set(sections.map(s => s.label));
            if (!FORMS.some(([, req]) => req.every(l => present.has(l)))) {
              reasons.push('the issue was not created from an issue form (or its required headings are missing)');
            }

            let counted = 0;
            for (const { label, lines } of sections) {
              const value = lines.join('\n').trim();
              if (EXEMPT.has(label)) continue;
              if (value !== '_No response_') counted += value.length;
              const limit = FIELD_LIMITS.get(label);
              if (limit === undefined || value === '_No response_') continue;
              if (value.length > limit) {
                reasons.push(`"${label}" is ${value.length} characters (limit ${limit})`);
              }
            }

            if (counted > MAX_BODY) {
              reasons.push(`the issue is ${counted} characters excluding logs and command output (limit ${MAX_BODY})`);
            }

            if (reasons.length === 0) return;

            const limitsOf = (...labels) => labels.map(l => `${l} ${FIELD_LIMITS.get(l)}`).join(', ');
            const comment = [
              'This issue was closed automatically because:',
              '',
              ...reasons.map(r => `- ${r}`),
              '',
              `Issues must be created from a form at https://github.com/${owner}/${repo}/issues/new/choose (issues filed via the API or CLI that skip the form are closed).`,
              '',
              'Required fields:',
              ...FORMS.map(([name, req]) => `- ${name}: ${req.join(', ')}`),
              '',
              `Limits (characters): ${limitsOf('Problem', 'Proposed behaviour')}; ${limitsOf('Expected', 'Actual', 'Alternatives')}; total ${MAX_BODY}, excluding logs and command output.`,
              '',
              'Please refile using a form and stay within these limits.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number, body: comment,
            });
            await github.rest.issues.update({
              owner, repo, issue_number: issue.number,
              state: 'closed', state_reason: 'not_planned',
            });
