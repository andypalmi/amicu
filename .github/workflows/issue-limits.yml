name: Issue limits

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  limits:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const issue = context.payload.issue;
            const { owner, repo } = context.repo;
            const trusted = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            if (trusted.includes(issue.author_association)) return;

            const MAX_OPEN = 3;
            const MAX_BODY = 3000;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', creator: issue.user.login, per_page: 100,
            });
            const others = open.filter(i => !i.pull_request && i.number !== issue.number);

            if (others.length >= MAX_OPEN) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `You have ${others.length} open issues; please wait for those to be triaged before filing more.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number,
                state: 'closed', state_reason: 'not_planned',
              });
              return;
            }

            if ((issue.body || '').length > MAX_BODY) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: issue.number, labels: ['needs-trim'],
              });
            }
