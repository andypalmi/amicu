# cargo-audit ignore list. Every entry below is a *known, accepted* advisory
# with no available fix in the version range this workspace can currently
# use — CI would otherwise be permanently red on `main` for issues we cannot
# resolve today. Each entry states why it's safe to ignore and the condition
# under which it should be removed. Do not add an entry here without both.

[advisories]
ignore = [
    # h2 0.3.27 — unbounded empty DATA frames (h2 http/2 server DoS).
    # Fixed only in h2 >=0.4.16; no patched 0.3.x release exists on crates.io
    # (checked 2026-09-16). Pulled solely as a **dev-dependency**:
    # jsonschema 0.17.1 (dev-dep of amicu-plan) -> reqwest 0.11.27 ->
    # hyper 0.14.32 -> h2 0.3.27. Not present in any release binary.
    # Removal condition: remove this ignore once jsonschema (or its reqwest/
    # hyper chain) is upgraded past hyper 0.14, or amicu-plan's dev-dependency
    # on jsonschema is dropped/replaced.
    "RUSTSEC-2026-0258",

    # rsa 0.9.10 — Marvin Attack timing sidechannel. No upstream fix exists.
    # Pulled by jsonwebtoken 11's `rust_crypto` feature, which bundles `rsa`
    # unconditionally alongside ed25519-dalek/hmac/p256/p384 (no finer-grained
    # feature to exclude just RSA on this backend). The Marvin attack needs
    # timing of RSA private-key operations (PKCS#1 v1.5 decryption or
    # signing). Production only verifies RS256 with Google's RSA public keys:
    # Validation::new(Algorithm::RS256) at crates/amicu-auth/src/google.rs:204,
    # the header check at google.rs:251, and
    # DecodingKey::from_rsa_components(&jwk.n, &jwk.e) at google.rs:330.
    # Public-key verification uses only the public exponent, so there is no
    # secret-dependent timing to observe. Private-key RSA
    # (EncodingKey::from_rsa_der, google.rs:520, and RS256 headers at
    # google.rs:536 and 819) exists only in the `mod tests` that starts at
    # google.rs:464. amicu's own tokens are signed with EdDSA only
    # (crates/amicu-auth/src/key.rs:92). See
    # crates/amicu-auth/SECURITY-NOTES.md for the full writeup.
    # Removal condition: jsonwebtoken ships a rust_crypto feature split that
    # excludes rsa, the project adopts the aws_lc_rs backend instead (drops
    # the rsa dep, adds a cmake build-time requirement), or jsonwebtoken is
    # replaced with a non-RSA-coupled JWT crate.
    "RUSTSEC-2023-0071",

    # crypto-bigint 0.5.5 - timing variability in operations meant to be
    # constant-time. Fixed only in crypto-bigint >=0.7.6; there is no patched
    # 0.5.x. This copy is pulled solely by jsonwebtoken 11's `rust_crypto`
    # feature: jsonwebtoken -> p256 0.13 / p384 0.13 -> elliptic-curve 0.13
    # -> crypto-bigint 0.5.5 (every jsonwebtoken release up to 11.1.0 still
    # requires p256/p384 ^0.13). That code only runs for ES256/ES384, which
    # amicu never accepts or produces: every `Validation` pins one algorithm
    # (EdDSA at crates/amicu-auth/src/verifier.rs:162, RS256 at
    # crates/amicu-auth/src/google.rs:204, also checked on the header at
    # google.rs:251), `jsonwebtoken::decode` rejects any header alg outside
    # that set before it builds a verifier, every DecodingKey is Ed25519 or
    # RSA, and signing uses EdDSA only (crates/amicu-auth/src/key.rs:92).
    # See crates/amicu-auth/SECURITY-NOTES.md.
    # The same advisory also covers the crypto-bigint 0.7.x copy (russh ->
    # p256 0.14), which is fixed by version instead: cargo-audit ignores by ID,
    # so that copy must stay at >=0.7.10 in Cargo.lock.
    # Removal condition: remove this ignore once jsonwebtoken moves to the
    # elliptic-curve 0.14 / RustCrypto 0.14 stack (crypto-bigint 0.7), or
    # jsonwebtoken is replaced with a JWT crate that does not pull it.
    "RUSTSEC-2026-0387",
]
